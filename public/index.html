<!DOCTYPE html>
<html>

<head>
    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>📚 Library Management System</h1>
    </div>


    <div class="container">

        <!-- ========================= -->
        <!-- ADD BOOK SECTION -->
        <!-- ========================= -->

        <h2>➕ Add Book</h2>

        <form id="bookForm">

            <label for="bookName">Book Name:</label>

            <input
                type="text"
                id="bookName"
                placeholder="Enter book name"
                required
            >


            <label for="author">Author:</label>

            <input
                type="text"
                id="author"
                placeholder="Enter author name"
                required
            >


            <button type="submit">
                Add Book
            </button>

        </form>


        <!-- Message -->
        <p id="message"></p>


        <!-- ========================= -->
        <!-- ALL BOOKS SECTION -->
        <!-- ========================= -->

        <h2>📖 All Books</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Action</th>
                </tr>

            </thead>


            <tbody id="bookList">

                <!-- Books will appear here -->

            </tbody>

        </table>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>


        // ==========================================
        // ADD BOOK
        // ==========================================

        const bookForm = document.getElementById("bookForm");

        const message = document.getElementById("message");


        bookForm.addEventListener("submit", async function(event) {

            // Stop page from refreshing
            event.preventDefault();


            // Get values from input boxes
            const name =
                document.getElementById("bookName").value;

            const author =
                document.getElementById("author").value;


            try {

                // Send book to server
                const response = await fetch("/books", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        author: author
                    })

                });


                const data = await response.json();


                // If book was added successfully
                if (response.ok) {

                    message.textContent =
                        data.message;

                    message.style.color = "green";


                    // Clear input boxes
                    bookForm.reset();


                    // Refresh book list
                    loadBooks();

                }

                else {

                    message.textContent =
                        data.message;

                    message.style.color = "red";

                }

            }

            catch (error) {

                message.textContent =
                    "Unable to connect to server.";

                message.style.color = "red";

            }

        });



        // ==========================================
        // LOAD ALL BOOKS
        // ==========================================

        async function loadBooks() {

            try {

                // Get books from server
                const response =
                    await fetch("/books");


                const books =
                    await response.json();


                // Find table body
                const bookList =
                    document.getElementById("bookList");


                // Clear old rows
                bookList.innerHTML = "";


                // Add every book to table
                books.forEach(function(book) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>${book.id}</td>

                        <td>${book.name}</td>

                        <td>${book.author}</td>

                        <td>

                            <button
                                onclick="deleteBook(${book.id})"
                            >
                                🗑️ Delete
                            </button>

                        </td>

                    `;


                    bookList.appendChild(row);

                });

            }

            catch (error) {

                console.log(
                    "Unable to load books."
                );

            }

        }



        // ==========================================
        // DELETE BOOK
        // ==========================================

        async function deleteBook(id) {


            // Ask for confirmation
            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this book?"
                );


            // If user clicks Cancel
            if (!confirmDelete) {

                return;

            }


            try {

                // Send DELETE request
                const response =
                    await fetch(`/books/${id}`, {

                        method: "DELETE"

                    });


                const data =
                    await response.json();


                // Show result
                alert(data.message);


                // Refresh book list
                loadBooks();

            }

            catch (error) {

                alert(
                    "Unable to delete book."
                );

            }

        }



        // ==========================================
        // LOAD BOOKS WHEN PAGE OPENS
        // ==========================================

        loadBooks();


    </script>

</body>

</html>
